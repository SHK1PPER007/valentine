<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Валентинка</title>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- ========= БЛОК ТАЙМЕРА (до 14 февраля) ========= -->
        <div id="countdown" class="countdown-section">
            <div class="countdown-card">
                <h2>❤️ Скоро 14 февраля!</h2>
                <div class="timer">
                    <div class="timer-item">
                        <span id="days">00</span>
                        <span class="timer-label">дней</span>
                    </div>
                    <div class="timer-item">
                        <span id="hours">00</span>
                        <span class="timer-label">часов</span>
                    </div>
                    <div class="timer-item">
                        <span id="minutes">00</span>
                        <span class="timer-label">минут</span>
                    </div>
                    <div class="timer-item">
                        <span id="seconds">00</span>
                        <span class="timer-label">секунд</span>
                    </div>
                </div>
                <p class="countdown-message">Создание открыток станет доступным<br>в 00:00 14 февраля ✨</p>
            </div>
        </div>

        <!-- ========= РЕДАКТОР (доступен только с 14.02) ========= -->
        <div id="editor" class="editor-section hidden">
            <div id="previewCard" class="card style1">
                <h3>💌 Открытка</h3>
                <div id="previewTo" class="to-from">💗 Для: ...</div>
                <div id="previewFrom" class="to-from">💖 От: ...</div>
                <div id="previewMsg" class="message">С 14 февраля! ❤️</div>
            </div>

            <div class="form-group">
                <label>💌 Для кого</label>
                <input type="text" id="toInput" placeholder="Имя получателя" value="Любимого человека">
            </div>
            <div class="form-group">
                <label>💞 От кого</label>
                <input type="text" id="fromInput" placeholder="Ваше имя" value="Твоего тайного поклонника">
            </div>
            <div class="form-group">
                <label>📝 Поздравление</label>
                <textarea id="msgInput" rows="3" placeholder="Напиши что-нибудь нежное...">С 14 февраля! ❤️</textarea>
            </div>

            <label>🎨 Оформление</label>
            <div class="style-selector">
                <div id="style1Btn" class="style-btn active" data-style="1">
                    <span>🌸</span> Романтика
                </div>
                <div id="style2Btn" class="style-btn" data-style="2">
                    <span>🌷</span> Нежность
                </div>
                <div id="style3Btn" class="style-btn" data-style="3">
                    <span>💎</span> Современный
                </div>
            </div>

            <button id="generateBtn" class="btn">🔗 Создать короткую ссылку</button>

            <!-- блок со ссылкой -->
            <div id="linkContainer" style="margin-top: 24px; display: none;">
                <div class="short-link-area">
                    <input type="text" id="shortLinkInput" readonly>
                    <button id="copyLinkBtn" class="copy-btn">📋 Копировать</button>
                </div>
                <p style="color: #9e3c4b; margin-top: 10px; font-size: 0.9rem;">
                    ✨ Ссылка сжата до минимума и зашифрована
                </p>
            </div>
        </div>

        <!-- ========= ПРОСМОТР ГОТОВОЙ ОТКРЫТКИ ========= -->
        <div id="viewer" class="viewer-section hidden">
            <div id="viewerCard" class="card style1"></div>
            <div id="viewerAction"></div>
        </div>

        <!-- ========= ФУТЕР: НАДПИСЬ + ЛОГОТИП ========= -->
        <div class="footer">
            <div class="footer-text">❤️ С 14 февраля!</div>
            <a href="#" target="_blank" rel="noopener noreferrer" class="footer-logo-link">
                <img src="logo.png" alt="Хи‑Хи Лис" class="footer-logo">
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
